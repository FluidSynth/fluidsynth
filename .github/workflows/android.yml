name: FluidSynth Android

on:
  workflow_dispatch:
  # Run every PR so path filters cannot leave required checks pending.
  pull_request:
  push:
    branches: ['**']
    paths:
      - '**'
      - '!.azure/**'
      - '!.circleci/**'
      - '!.github/**'
      - '.github/workflows/android.yml'
      - '.github/scripts/android-*.sh'
      - '.github/vcpkg-android/**'
      - '!README.md'
  schedule:
    # Weekly build without dependency caches.
    - cron: '0 0 * * 1'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  VCPKG_VERSION: '2026.10.16'
  NDK_VERSION: '27.3.13750724'
  # Run compatibility tests at the minimum supported API level.
  ANDROID_API: '24'

jobs:
  build-test:
    env:
      ABI: ${{ matrix.abi }}
      ANDROID_BUILD_DIR: ${{ github.workspace }}/build/android
    name: Build and test ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - uses: actions/checkout@v7
      - name: Checkout build dependencies
        run: git -c submodule.test/manual.update=none submodule update --init --depth=1 --recursive
      - name: Locate the pinned NDK
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [[ ! -f "$ndk/build/cmake/android.toolchain.cmake" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          # Expose the runner's ANDROID_HOME to ${{ env.ANDROID_HOME }} in later steps.
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          cmake --version
          cat "$ndk/source.properties"
      - uses: actions/cache/restore@v6
        id: dependencies
        if: ${{ github.event_name != 'schedule' }}
        with:
          path: build/android/dependencies
          key: android-deps-${{ runner.os }}-${{ runner.arch }}-${{ matrix.abi }}-api${{ env.ANDROID_API }}-ndk${{ env.NDK_VERSION }}-vcpkg${{ env.VCPKG_VERSION }}-${{ hashFiles('.github/vcpkg-android/vcpkg.json', '.github/vcpkg-android/triplets/*.cmake') }}
      - name: Checkout vcpkg release
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_VERSION }}
          path: build/android/vcpkg
      - name: Build dependencies
        env:
          VCPKG_ROOT: ${{ github.workspace }}/build/android/vcpkg
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: bash .github/scripts/android-build.sh build-dependencies
      # Save before FluidSynth installs into the same prefix.
      - uses: actions/cache/save@v6
        if: ${{ github.event_name != 'schedule' && steps.dependencies.outputs.cache-hit != 'true' }}
        with:
          path: build/android/dependencies
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Build and install FluidSynth, test executables and asset loader
        run: bash .github/scripts/android-build.sh build-and-install
      - name: Verify and package shared libraries and headers
        run: bash .github/scripts/android-build.sh package
      - name: Cache the API ${{ env.ANDROID_API }} emulator system image
        uses: actions/cache@v6
        if: ${{ (matrix.abi == 'x86' || matrix.abi == 'x86_64') && github.event_name != 'schedule' }}
        with:
          path: ${{ env.ANDROID_HOME }}/system-images/android-${{ env.ANDROID_API }}/default/${{ matrix.abi }}
          key: android-sysimg-v1-${{ runner.os }}-${{ runner.arch }}-api${{ env.ANDROID_API }}-default-${{ matrix.abi }}
      - name: Install the emulator image and grant KVM access
        if: matrix.abi == 'x86' || matrix.abi == 'x86_64'
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          packages=()
          if [[ ! -f "$ANDROID_HOME/system-images/android-$ANDROID_API/default/$ABI/source.properties" ]]; then
            packages+=("system-images;android-$ANDROID_API;default;$ABI")
          fi
          if [[ ! -x "$ANDROID_HOME/emulator/emulator" ]]; then packages+=(emulator); fi
          if [[ ! -x "$ANDROID_HOME/platform-tools/adb" ]]; then packages+=(platform-tools); fi
          if (( ${#packages[@]} )); then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "${packages[@]}"
          fi
          cat "$ANDROID_HOME/emulator/source.properties"
          cat "$ANDROID_HOME/system-images/android-$ANDROID_API/default/$ABI/source.properties"
      - name: Run native tests in the emulator
        if: matrix.abi == 'x86' || matrix.abi == 'x86_64'
        run: bash .github/scripts/android-run-emulator.sh build/android "$ABI"
      - name: Cache the ARM Android userspace
        if: ${{ (matrix.abi == 'armeabi-v7a' || matrix.abi == 'arm64-v8a') && github.event_name != 'schedule' }}
        id: runtime
        uses: actions/cache@v6
        with:
          path: build/android/runtime
          key: android-runtime-api${{ env.ANDROID_API }}-${{ matrix.abi }}-${{ hashFiles('.github/scripts/android-prepare-runtime.sh') }}
      - name: Install and extract the ARM Android userspace
        if: ${{ (matrix.abi == 'armeabi-v7a' || matrix.abi == 'arm64-v8a') && steps.runtime.outputs.cache-hit != 'true' }}
        run: bash .github/scripts/android-prepare-runtime.sh "$ABI" build/android/runtime
      - name: Bundle ARM tests and Android userspace
        if: matrix.abi == 'armeabi-v7a' || matrix.abi == 'arm64-v8a'
        run: tar -C build/android -czf "$RUNNER_TEMP/android-tests.tar.gz" tests runtime
      - uses: actions/upload-artifact@v7
        if: matrix.abi == 'armeabi-v7a' || matrix.abi == 'arm64-v8a'
        with:
          name: android-tests-${{ matrix.abi }}
          path: ${{ runner.temp }}/android-tests.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: fluidsynth-android${{ env.ANDROID_API }}-${{ matrix.abi }}
          path: build/android/package
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-logs-${{ matrix.abi }}
          path: |
            build/android/logs
            build/android/tests/Testing
            build/android/tests/android-tests.xml
            build/android/build/**/CMakeFiles/CMakeConfigureLog.yaml
            build/android/vcpkg/buildtrees/**/*.log
          retention-days: 14

  # Hosted ARM runners do not expose nested KVM. Execute Android/Bionic tests
  # on their Linux kernel; Android framework services and device drivers remain
  # outside this path's coverage. Keep x86 Android emulator tests above.
  arm-tests:
    env:
      ABI: ${{ matrix.abi }}
    name: Native Android/Bionic ${{ matrix.abi }}
    needs: build-test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android-tests-${{ matrix.abi }}
          path: ${{ runner.temp }}/android-tests
      - name: Run native ARM Android binaries
        run: |
          bash .github/scripts/android-run-native-tests.sh "$ABI" \
            "$RUNNER_TEMP/android-tests/android-tests.tar.gz" "$RUNNER_TEMP/native-tests"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-native-logs-${{ matrix.abi }}
          path: |
            ${{ runner.temp }}/native-tests/logs
            ${{ runner.temp }}/native-tests/tests/Testing
            ${{ runner.temp }}/native-tests/tests/android-tests.xml
            ${{ runner.temp }}/native-tests/runtime/provenance.txt
          retention-days: 14
