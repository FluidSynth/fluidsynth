name: FluidSynth Linux

on:
  pull_request:
  push:
    branches:
      - '**'
    paths-ignore:
      - '.azure/**'
      - '.circleci/**'
      - '.github/workflows/freebsd.yml'
      - '.github/workflows/api_doc_build.yml'
      - '.github/workflows/sonarcloud.yml'
      - '.github/workflows/solaris.yml'
      - '.github/workflows/windows.yml'
      - '.github/workflows/ios.yml'
      - '.github/workflows/os2.yml'
      - '.github/workflows/rendering-regression.yml'
      - 'test/run-android-tests.sh'
      - 'README.md'

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo
  INSTALL_LOCATION: ${{github.workspace}}/fluidsynth_install

# Use a bash shell so we can use the same syntax for environment variable
# access regardless of the host operating system
defaults:
  run:
    shell: bash

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ${{ matrix.image }}
    name: Build (${{ matrix.image }}, ${{ matrix.configuration.compiler || 'gcc' }}, ${{ matrix.configuration.flags }})
    env:
      CC: ${{ matrix.configuration.compiler == 'clang' && 'clang-18' || '' }}
      CXX: ${{ matrix.configuration.compiler == 'clang' && 'clang++-18' || '' }}
    strategy:
      matrix:
        image: [ubuntu-24.04, ubuntu-24.04-arm]
        configuration:
          - {flags: "-Denable-profiling=1"}
          - {flags: "-Denable-floats=1 -Denable-profiling=1"}
          - {flags: "-Denable-floats=1"}
          - {flags: "-Denable-trap-on-fpe=1"}
          - {flags: "-Denable-fpe-check=1"}
          - {flags: "-Denable-ipv6=0"}
          - {flags: "-Denable-network=0"}
          - {flags: "-Denable-aufile=0"}
          - {flags: "-DBUILD_SHARED_LIBS=0"}
          - {flags: "-Denable-debug=1 -DCMAKE_C_FLAGS_DEBUG=-fuse-ld=gold"}
          - {flags: "-Dosal=cpp11 -Denable-ladspa=0"}
          - {compiler: clang, flags: ""}
          - {compiler: clang, flags: "-DBUILD_SHARED_LIBS=0"}
        exclude:
          # Keep the legacy x87 checker on x86: fluid_check_fpe_i386() emits
          # fnstsw/fnclex instructions, which cannot be assembled for ARM.
          - image: ubuntu-24.04-arm
            configuration: {flags: "-Denable-fpe-check=1"}
# clang9 is covered by openSUSE Leap 15.2
# clang11 is covered by openSUSE Leap 15.3

    steps:
    - uses: actions/checkout@v7

    - name: Checkout build dependencies
      # Skip test/manual; this workflow does not run check_rendering or check_manual.
      run: git -c submodule.test/manual.update=none submodule update --init --depth=1 --recursive

    - name: Update apt
      run: sudo apt-get update -y

    - name: Install dependencies
      # Consider caching APT packages in the future to reduce dependency setup time.
      run: |
        sudo apt-get -yq --no-install-suggests --no-install-recommends install \
          ladspa-sdk \
          libasound2-dev \
          libdbus-1-dev \
          libjack-dev \
          libmp3lame-dev \
          libpulse-dev \
          libreadline-dev \
          libsndfile-dev \
          libsystemd-dev \
          libomp-dev \
          portaudio19-dev

    - name: Configure CMake
      run: |
        cmake -S . \
          -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DCMAKE_VERBOSE_MAKEFILE=1 \
          -DCMAKE_POSITION_INDEPENDENT_CODE=1 \
          -Werror=dev \
          -DCMAKE_INSTALL_PREFIX=$INSTALL_LOCATION \
          -Denable-portaudio=1 \
          -Denable-ladspa=1 \
          -DNO_GUI=1 \
          ${{ matrix.configuration.flags }}

    - name: Build
      run: cmake --build build

    - name: Test
      run: cmake --build build --target check

    - name: Demo
      run: cmake --build build --target demo

    - name: Install
      run: cmake --install build && ls -la $INSTALL_LOCATION

    - name: Consume from pkg-config
      if: ${{ contains(matrix.configuration.flags, 'BUILD_SHARED_LIBS=0') }}
      run: |
        set -e
        cat << EOF > static-link-test.c
        #include <fluidsynth.h>
        int main() { fluid_synth_process(0,0,0,0,0,0); return 0; }
        EOF
        export PKG_CONFIG_PATH=$INSTALL_LOCATION/lib/pkgconfig
        set -x
        g++ -fPIE -o static-link-test static-link-test.c $(pkg-config --cflags --static fluidsynth) $(pkg-config --libs --static fluidsynth)
        ./static-link-test
        echo $?

    - name: Consume from build
      run: |
        set -e
        cmake -S test/cmake \
          -B consume-build \
          -G Ninja \
          -DFluidSynth_DIR="${{github.workspace}}/build" \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        cmake --build consume-build

    - name: Consume from install
      run: |
        set -e
        cmake -S test/cmake -B consume-install \
          -G Ninja \
          -DFluidSynth_DIR="$INSTALL_LOCATION/lib/cmake/fluidsynth" \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        cmake --build consume-install

  # Tests to see if FluidSynth will build with GCC for PowerPC targets that use the IBM long double ABI
  build-ibm-long-double:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: -u root
      volumes:
        - /etc/ssl/certs:/etc/ssl/certs

    steps:
    - name: Update apt
      run: |
        dpkg --add-architecture ppc64el
        apt-get update -y

    - name: Install Dependencies
      run: |
        apt-get -yq --no-install-suggests --no-install-recommends install \
          git \
          gcc-powerpc64le-linux-gnu \
          g++-powerpc64le-linux-gnu \
          cmake \
          cmake-data \
          ninja-build

    - uses: actions/checkout@v7

    - name: Checkout build dependencies
      # Skip test/manual; this workflow does not run check_rendering or check_manual.
      run: git -c safe.directory="$GITHUB_WORKSPACE" -c submodule.test/manual.update=none submodule update --init --depth=1 --recursive

    - name: Configure CMake
      run: |
        export CFLAGS="$CFLAGS -mabi=ibmlongdouble -Wno-psabi"
        export CXXFLAGS="$CXXFLAGS -mabi=ibmlongdouble -Wno-psabi"
        cmake -S . \
          -B build \
          -G Ninja \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=ppc64le \
          -DCMAKE_C_COMPILER=powerpc64le-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=powerpc64le-linux-gnu-g++ \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DCMAKE_VERBOSE_MAKEFILE=1 \
          -DCMAKE_POSITION_INDEPENDENT_CODE=1 \
          -Werror=dev \
          -DCMAKE_INSTALL_PREFIX=$INSTALL_LOCATION \
          -Dosal=embedded \
          -DNO_GUI=1

    - name: Build
      run: cmake --build build
